template_status: propuesta_tecnica_asistida_no_evaluable
academic_notice: >-
  Ficha reconstruida con IA para S06-11. No sustituye la ficha individual de R3.
id: estructurar_encargo_admision
version: 2.0.0
purpose: >-
  Convertir el encargo literal recibido por P1 Admisión en una orden E1 completa,
  sin omitir restricciones ni inventar campos.
exists_because: responsabilidad independiente con salida propia y verificable
adversarial_to: null
use_when:
  - fase de admisión, con encargo literal disponible y antes de seleccionar evidencia
do_not_use_when:
  - seleccionar filas de F-1, analizar incidentes o redactar el artefacto final
  - falta el encargo literal del cliente
input_schema_ref: schemas/encargo_admision.schema.json
output_schema_ref: schemas/orden_trabajo_e1.schema.json
allowed_tools:
  - read_client_request
  - validate_schema
permissions:
  read:
    - project:INPUT/encargo_cliente.json
  write:
    - project:WORK/orden_trabajo_e1.json
  side_effects: false
context_policy:
  isolation: minimal_and_isolated
  receives:
    - encargo literal del cliente
    - esquema E1
  excludes:
    - registro F-1, resultados de puestos posteriores y artefacto final
memory_write: propose_only
forbidden:
  - ampliar la allowlist de herramientas
  - escribir fuera de project:WORK/orden_trabajo_e1.json
  - omitir, suavizar o inventar alcance, exclusiones, evidencia, presupuesto o formato
on_failure:
  status: not_answerable_or_error
  reason_codes:
    - missing_client_request
    - invalid_input_schema
    - insufficient_evidence
    - tool_failure
    - budget_exhausted
  payload_required:
    - código de razón
    - campo literal faltante o ambiguo
    - operación intentada
    - fragmento del encargo comprobado
stop_conditions:
  - kind: semantic
    condition: >-
      La orden valida contra E1 y cada restricción literal está mapeada a un campo.
    threshold: 1
  - kind: budget
    condition: Se alcanzan cinco operaciones de lectura o validación.
    threshold: 5
  - kind: no_progress
    condition: >-
      Dos operaciones consecutivas no completan un campo ni resuelven un error.
    threshold: 2
success_metric:
  name: literal_constraints_preserved_rate
  calculation: restricciones literales preservadas / restricciones exigidas; objetivo 1.0
evals:
  - evals/admision_esquema_e1.jsonl

